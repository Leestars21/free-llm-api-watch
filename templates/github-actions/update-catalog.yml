name: Update Free LLM API Catalog

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: free-llm-api-watch

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install optional dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Update catalog
        id: update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python scripts/update_catalog.py
          python scripts/validate_catalog.py
          python scripts/score_models.py
          python scripts/render_docs.py
          python -m unittest discover -s tests -v

      - name: Upload debug artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: free-llm-api-watch-debug
          path: |
            ${{ env.PROJECT_DIR }}/data/source_snapshots.json
            ${{ env.PROJECT_DIR }}/data/free_api_catalog.json
            ${{ env.PROJECT_DIR }}/docs/changelog.md
          if-no-files-found: ignore

      - name: Commit changes
        if: success() && steps.update.outputs.source_failures == '0'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain "$PROJECT_DIR")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$PROJECT_DIR/data" "$PROJECT_DIR/docs" "$PROJECT_DIR/README.md" "$PROJECT_DIR/README.en.md"
            git commit -m "Update free LLM API catalog"
            git push
          else
            echo "No catalog changes"
          fi
      - name: Skip commit when a source check failed
        if: success() && steps.update.outputs.source_failures != '0'
        run: echo "At least one source check failed; catalog was validated locally but automatic commit is skipped."

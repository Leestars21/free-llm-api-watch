schema_version: 2
generated_for: free-llm-api-watch
notes:
  - This is the provider monitoring inventory. Evidence-backed offer and model records live in manual_catalog.json and free_api_catalog.json.
  - A free-policy status does not mean every account, region, model or API endpoint is eligible.
  - Model-list APIs prove model existence only; free access requires separate first-party pricing or policy evidence.
  - Only check an authenticated inventory when the matching environment variable is already configured; never store credentials here.
  - API checks store model IDs and hashes, not credentials or full response bodies.

